[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imagen-cli"
version = "0.1.8"
description = "Persistent image creation workbench for humans and agents"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = ["typer>=0.15", "pydantic>=2.10,<3", "httpx>=0.28", "Pillow>=11", "platformdirs>=4", "rich>=13", "jsonschema>=4.23"]

[project.scripts]
imagen = "imagen_cli.cli.entrypoint:main"

[project.urls]
Homepage = "https://github.com/NekoCCN/ImagenCli"
Source = "https://github.com/NekoCCN/ImagenCli"
Releases = "https://github.com/NekoCCN/ImagenCli/releases"

[project.optional-dependencies]
vertex = ["google-auth>=2"]
tui = [
    "textual>=8.2.8",
]
postprocess = ["numpy>=2"]
keyring = ["keyring>=25"]
ai-onnx = ["onnxruntime>=1.20", "onnx>=1.20", "numpy>=2"]
ai-onnx-gpu = ["onnxruntime-gpu>=1.20", "onnx>=1.20", "numpy>=2"]
ai-openvino = ["onnxruntime-openvino>=1.20", "onnx>=1.20", "numpy>=2"]
ai-torch = ["torch>=2.4", "numpy>=2"]

[dependency-groups]
dev = [
    "pytest>=8", "ruff>=0.11", "mypy>=1.15", "jsonschema>=4.23", "types-jsonschema>=4",
    "numpy>=2", "textual>=8.2.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imagen_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "src/imagen_cli",
  "tests",
  "README.md",
  "README.en.md",
  "README.zh-CN.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: separately authorized paid provider tests", "performance: explicit performance benchmarks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["imagen_cli"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "torch", "torch.*", "keyring"]
ignore_missing_imports = true
