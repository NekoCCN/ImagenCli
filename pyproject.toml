[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "imagen-cli"
version = "0.1.0"
description = "Persistent image creation workbench for humans and agents"
requires-python = ">=3.12"
dependencies = ["typer>=0.15", "pydantic>=2.10,<3", "httpx>=0.28", "Pillow>=11", "platformdirs>=4", "rich>=13", "jsonschema>=4.23"]

[project.scripts]
imagen = "imagen_cli.cli.entrypoint:main"

[project.optional-dependencies]
vertex = ["google-auth>=2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "jsonschema>=4.23", "types-jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["src/imagen_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: separately authorized paid provider tests", "performance: explicit performance benchmarks"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["imagen_cli"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
